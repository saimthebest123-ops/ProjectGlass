
workflows:
  ios-workflow:
    name: Project Glass iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.projectglass.app
    scripts:
      - name: Create Xcode project
        script: |
          cat > Package.swift <<'EOF'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "ProjectGlass",
              platforms: [.iOS(.v17)],
              products: [
                  .executable(name: "ProjectGlass", targets: ["ProjectGlass"])
              ],
              targets: [
                  .executableTarget(name: "ProjectGlass", path: ".",
                    exclude: ["README.md", "Package.swift", "codemagic.yaml"])
              ]
          )
          EOF
          swift package describe
