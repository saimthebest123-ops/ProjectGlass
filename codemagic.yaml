



      - name: Package unsigned IPA
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/ProjectGlass.app"

          test -d "$APP" || {
            echo "ERROR: ProjectGlass.app not found"
            exit 1
          }

          echo "App bundle contents:"
          du -sh "$APP"
          find "$APP" -maxdepth 2 -type f | head -40

          rm -rf Payload ProjectGlass.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry ProjectGlass.ipa Payload

          echo "Final IPA size:"
          ls -lh ProjectGlass.ipa
          /usr/bin/unzip -t ProjectGlass.ipa
