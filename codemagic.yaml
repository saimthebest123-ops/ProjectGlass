



  
workflows:
  projectglass-ios:
    name: Project Glass IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build app
        script: |
          xcodebuild \
            -project ProjectGlass.xcodeproj \
            -scheme ProjectGlass \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/ProjectGlass.app"
          test -d "$APP"
          echo "App bundle size:"
          du -sh "$APP"
          rm -rf Payload ProjectGlass.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry ProjectGlass.ipa Payload
          echo "Final IPA size:"
          ls -lh ProjectGlass.ipa
          /usr/bin/unzip -t ProjectGlass.ipa

    artifacts:
      - ProjectGlass.ipa
