workflows:
  projectglass-ios:
    name: Project Glass IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          xcodegen generate

      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          xcodebuild \
            -project ProjectGlass.xcodeproj \
            -scheme ProjectGlass \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app and package unsigned IPA
        script: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ProjectGlass.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: App bundle not found at $APP"
            find build -maxdepth 6 -name "*.app" -print || true
            exit 1
          fi

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist is missing"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo "ERROR: Executable missing: $APP/$EXECUTABLE"
            exit 1
          fi

          echo "Checking for accidental Git/build files in app bundle..."
          if find "$APP" \( -name "*.sample" -o -name "*.pack" -o -name "*.idx" -o -name "*.rev" -o -name ".git" \) -print | grep -q .; then
            echo "ERROR: Git metadata or sample files were copied into the app bundle."
            find "$APP" \( -name "*.sample" -o -name "*.pack" -o -name "*.idx" -o -name "*.rev" -o -name ".git" \) -print
            exit 1
          fi

          echo "App bundle size:"
          du -sh "$APP"
          echo "Executable details:"
          ls -lh "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE"
          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

          rm -rf Payload ProjectGlass.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry ProjectGlass.ipa Payload

          echo "IPA archive size:"
          ls -lh ProjectGlass.ipa
          echo "Archive validation:"
          /usr/bin/unzip -t ProjectGlass.ipa
          echo "IPA contents:"
          /usr/bin/unzip -l ProjectGlass.ipa

    artifacts:
      - ProjectGlass.ipa
