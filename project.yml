name: ProjectGlass

options:
  bundleIdPrefix: com.projectglass

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"

targets:
  ProjectGlass:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProjectGlassApp.swift
      - path: ContentView.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectglass.app
        PRODUCT_NAME: ProjectGlass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Project Glass
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
